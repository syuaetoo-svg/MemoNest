name: Groq live provider smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Manual only: no credentials for PR code, no model calls on ordinary CI.
      # The script uses synthetic data and emits only sanitized stage/status codes.
      - run: npm run test:ai:live
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
